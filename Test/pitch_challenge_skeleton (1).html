  Self-contained animation prototype.
  All screen assets are embedded as base64 below.
  In production, replace each DATA_URL with a real image path, e.g.:

    Pattern    : Center Burst
    Block Style: Scale Both
    Speed      : Very Slow (2.6×)
    Pitch Pause: 3 000 ms
    Finish FX  : Pulse Rings

  Canvas API + Vanilla JS — zero external dependencies.
-->
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#000; overflow:hidden; }

.stage {
  position: absolute;
  /* 256×256 native — scale up to fill available space proportionally */
  width: 256px; height: 256px;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(var(--stage-scale, 1));
  transform-origin: center center;
}

.screen {
  position: absolute; inset: 0;
  background-size: 100% 100%; background-repeat: no-repeat;
  opacity: 0;
}
#s-start  { opacity: 1; z-index: 10; }
#fx       { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
#confetti { position: absolute; inset: 0; z-index: 15; pointer-events: none;
            opacity: 0; transition: opacity 1.2s ease; }
</style>
</head>

</div>

// LOCKED CONFIG  ← edit here to change the feel

const CONFIG = {
  pattern   : 'center_out',  // block stagger pattern
  blockStyle: 'scale_both',  // how each block enters/exits
  speed     : 2.6,           // transition speed multiplier (1 = normal)
  pitchPause: 3000,          // ms to hold on Pitch Challenge before countdown
  finishFx  : 'pulse',       // finish screen background effect
  loop      : false,         // set true to replay automatically
};

// ─────────────────────────────────────────────────────────────────────────────
// CANVAS SETUP
// ─────────────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('fx');
const ctx    = canvas.getContext('2d');
const W = 256, H = 256;
const COLS = 10, ROWS = 10;
const BW = W / COLS, BH = H / ROWS;

// Scale stage to fill window while preserving aspect ratio
function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  document.getElementById('stage').style.setProperty('--stage-scale', s);
}
window.addEventListener('resize', resize);
resize();

// ─────────────────────────────────────────────────────────────────────────────
// BLOCK TRANSITION ENGINE
// ─────────────────────────────────────────────────────────────────────────────
function makeDelays(pattern) {
  const d = new Float32Array(COLS * ROWS);
  const cx = (COLS-1)/2, cy = (ROWS-1)/2;
  const maxD = Math.sqrt(cx*cx + cy*cy);
  let seed = 42;
  const rand = () => { seed=(seed*16807)%2147483647; return (seed-1)/2147483646; };

  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const i = r*COLS+c, nr=r/(ROWS-1), nc=c/(COLS-1), dc=c-cx, dr=r-cy;
    switch (pattern) {
      case 'diagonal':      d[i]=(nc+nr)/2; break;
      case 'anti_diagonal': d[i]=(nc+(1-nr))/2; break;
      case 'h_wave':        d[i]=nc; break;
      case 'v_wave':        d[i]=nr; break;
      case 'center_out':    d[i]=Math.sqrt(dc*dc+dr*dr)/maxD; break;
      case 'edges_in':      d[i]=1-Math.sqrt(dc*dc+dr*dr)/maxD; break;
      case 'scatter':       d[i]=rand(); break;
      case 'column_alt':    d[i]=nc+(r%2===0?nr:1-nr)*0.3; break;
      case 'honeycomb': {
        const hx=c+(r%2)*0.5, hy=r*0.866;
        d[i]=hx*0.55+hy*0.45; break;
      }
    }
  }
  const mn=Math.min(...d), mx=Math.max(...d);
  for (let i=0;i<d.length;i++) d[i]=(d[i]-mn)/(mx-mn);
  return d;
}

function drawBlock(c, r, t, style) {
  if (t <= 0) return;
  const p = Math.min(t,1), x=c*BW, y=r*BH;
  ctx.fillStyle = '#000';
  switch (style) {
    case 'scale_h':    ctx.fillRect(x,y,BW*p,BH); break;
    case 'scale_v':    ctx.fillRect(x,y+BH*(1-p),BW,BH*p); break;
    case 'scale_both': ctx.fillRect(x+BW/2-BW*p/2, y+BH/2-BH*p/2, BW*p, BH*p); break;
    case 'slide_l':    ctx.fillRect(x-BW+BW*p,y,BW,BH); break;
    case 'slide_t':    ctx.fillRect(x,y-BH+BH*p,BW,BH); break;
  }
}

function easeInOutQuart(t) {
  return t<.5 ? 8*t*t*t*t : 1-Math.pow(-2*t+2,4)/2;
}

function renderGrid(elapsed, stagger, blockDur, entering, delays, style) {
  ctx.clearRect(0,0,W,H);
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
    const i=r*COLS+c;
    const rawT=(elapsed-delays[i]*stagger)/blockDur;
    const t=easeInOutQuart(Math.max(0,Math.min(rawT,1)));
    drawBlock(c,r,entering?t:1-t,style);
  }
}

function tween(ms, fn) {
  return new Promise(res => {
    const t0=performance.now();
    (function tick(now){ const t=Math.min((now-t0)/ms,1); fn(t); t<1?requestAnimationFrame(tick):res(); })(performance.now());
  });
}
const wait = ms => new Promise(r=>setTimeout(r,ms));

// ─────────────────────────────────────────────────────────────────────────────
// SCREEN MANAGEMENT
// ─────────────────────────────────────────────────────────────────────────────
const IDS = ['start','pitch','count3','count2','count1','finish'];
const els = {};
IDS.forEach(id => els[id] = document.getElementById(`s-${id}`));

function showOnly(name) {
  IDS.forEach(id => {
    els[id].style.zIndex  = id===name ? 10 : 0;
    els[id].style.opacity = id===name ? 1  : 0;
  });
}

async function doBlockTransition(fromId, toId, delays) {
  const sp = CONFIG.speed;
  const STAGGER = Math.round(220*sp), BLOCK_D = Math.round(130*sp);
  const TOTAL = STAGGER+BLOCK_D, HOLD = Math.round(40*sp);

  els[fromId].style.zIndex=10; els[fromId].style.opacity=1;
  els[toId].style.zIndex=5;   els[toId].style.opacity=0;

  const t0=performance.now();
  await tween(TOTAL, _=>renderGrid(performance.now()-t0, STAGGER, BLOCK_D, true, delays, CONFIG.blockStyle));

  els[toId].style.opacity=1; els[toId].style.zIndex=10;
  els[fromId].style.zIndex=0; els[fromId].style.opacity=0;
  await wait(HOLD);

  const t1=performance.now();
  await tween(TOTAL, _=>renderGrid(performance.now()-t1, STAGGER, BLOCK_D, false, delays, CONFIG.blockStyle));

  ctx.clearRect(0,0,W,H);
}

async function doCut(fromId, toId) {
  els[toId].style.zIndex=11; els[toId].style.opacity=0;
  els[toId].style.transition='opacity 80ms ease';
  requestAnimationFrame(()=>{ els[toId].style.opacity=1; });
  await wait(80);
  els[fromId].style.opacity=0; els[fromId].style.zIndex=0;
  els[toId].style.transition='none'; els[toId].style.zIndex=10;
}

// ─────────────────────────────────────────────────────────────────────────────
// FINISH EFFECT ENGINE
// ─────────────────────────────────────────────────────────────────────────────
const cCanvas = document.getElementById('confetti');
const cCtx    = cCanvas.getContext('2d');
let fxActive=false, fxRAF=null, fxState={};

function rndColor(minA,maxA) {
  const COLS=[[255,255,255],[220,230,255],[200,215,255],[180,200,255],[160,185,255]];
  const [r,g,b]=COLS[Math.floor(Math.random()*COLS.length)];
  return `rgba(${r},${g},${b},${(minA+Math.random()*(maxA-minA)).toFixed(2)})`;
}

// Pulse rings
function tickPulse(s) {
  s.f=(s.f||0)+1;
  if(fxActive && s.f%55===0)
    s.rings.push({r:0,maxR:100+Math.random()*60,spd:0.35+Math.random()*0.3,
                  a:0.15+Math.random()*0.12,w:0.6+Math.random()*1.2});
  s.rings=(s.rings||[]).filter(ring=>{
    ring.r+=ring.spd;
    const alpha=ring.a*(1-ring.r/ring.maxR);
    if(alpha<=0.004) return false;
    cCtx.beginPath(); cCtx.arc(W/2,H/2,ring.r,0,Math.PI*2);
    cCtx.strokeStyle=`rgba(200,215,255,${alpha.toFixed(3)})`;
    cCtx.lineWidth=ring.w; cCtx.stroke();
    return ring.r<ring.maxR;
  });
}
// Shimmer
function initShimmer(s){
  s.dots=Array.from({length:65},()=>({x:Math.random()*W,y:Math.random()*H,
    r:0.4+Math.random()*1.1,phase:Math.random()*Math.PI*2,
    spd:0.018+Math.random()*0.028,baseA:0.07+Math.random()*0.2}));
}
function tickShimmer(s){
  s.dots.forEach(d=>{
    d.phase+=d.spd;
    const a=d.baseA*(0.5+0.5*Math.sin(d.phase));
    if(a<0.01) return;
    cCtx.beginPath(); cCtx.arc(d.x,d.y,d.r,0,Math.PI*2);
    cCtx.fillStyle=`rgba(220,230,255,${a.toFixed(3)})`; cCtx.fill();
  });
}
// Floating orbs
function initOrbs(s){
  s.orbs=Array.from({length:5},()=>({x:Math.random()*W,y:Math.random()*H,
    r:30+Math.random()*45,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,
    a:0.04+Math.random()*0.05,phase:Math.random()*Math.PI*2,ps:0.007+Math.random()*0.007}));
}
function tickOrbs(s){
  s.orbs.forEach(o=>{
    o.x+=o.vx; o.y+=o.vy; o.phase+=o.ps;
    if(o.x<-o.r)o.x=W+o.r; if(o.x>W+o.r)o.x=-o.r;
    if(o.y<-o.r)o.y=H+o.r; if(o.y>H+o.r)o.y=-o.r;
    const a=o.a*(0.7+0.3*Math.sin(o.phase));
    const g=cCtx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
    g.addColorStop(0,`rgba(200,215,255,${a.toFixed(3)})`);
    g.addColorStop(1,'rgba(200,215,255,0)');
    cCtx.beginPath(); cCtx.arc(o.x,o.y,o.r,0,Math.PI*2);
    cCtx.fillStyle=g; cCtx.fill();
  });
}
// Scanline
function tickScanline(s){
  s.f=(s.f||0)+1;
  if(fxActive&&s.f%90===0)
    (s.lines=s.lines||[]).push({y:-2,spd:0.5+Math.random()*.4,h:1+Math.random()*2,a:0.09+Math.random()*.07});
  s.lines=(s.lines||[]).filter(l=>{
    l.y+=l.spd;
    const fa=l.y>H*.65?l.a*(1-(l.y-H*.65)/(H*.35)):l.a;
    if(fa<=0) return false;
    const g=cCtx.createLinearGradient(0,0,W,0);
    g.addColorStop(0,'rgba(200,215,255,0)');
    g.addColorStop(.15,`rgba(220,230,255,${fa.toFixed(3)})`);
    g.addColorStop(.85,`rgba(220,230,255,${fa.toFixed(3)})`);
    g.addColorStop(1,'rgba(200,215,255,0)');
    cCtx.fillStyle=g; cCtx.fillRect(0,l.y,W,l.h);
    return l.y<H+5;
  });
}
// Confetti
function mkFall(){return{x:Math.random()*W,y:-3-Math.random()*15,r:0.6+Math.random()*1.4,
  vy:0.3+Math.random()*0.5,vx:(Math.random()-.5)*.3,sway:(Math.random()-.5)*.01,color:rndColor(.2,.6)};}
function tickConfetti(s){
  if(fxActive)for(let i=0;i<2;i++)(s.p=s.p||[]).push(mkFall());
  s.p=(s.p||[]).filter(p=>{
    p.vx+=p.sway;p.x+=p.vx;p.y+=p.vy;
    const a=p.y<H*.45?1:Math.max(0,1-(p.y-H*.45)/(H*.55));
    if(a<=0)return false;
    cCtx.save();cCtx.globalAlpha=a;
    cCtx.beginPath();cCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
    cCtx.fillStyle=p.color;cCtx.fill();cCtx.restore();
    return p.y<H+4;
  });
}
// Rise
function mkRise(){return{x:Math.random()*W,y:H+3+Math.random()*15,r:0.5+Math.random()*1.3,
  vy:-(0.25+Math.random()*.45),vx:(Math.random()-.5)*.3,sway:(Math.random()-.5)*.009,color:rndColor(.15,.5)};}
function tickRise(s){
  if(fxActive)for(let i=0;i<2;i++)(s.p=s.p||[]).push(mkRise());
  s.p=(s.p||[]).filter(p=>{
    p.vx+=p.sway;p.x+=p.vx;p.y+=p.vy;
    const a=p.y>H*.55?1:Math.max(0,p.y/(H*.55));
    if(a<=0)return false;
    cCtx.save();cCtx.globalAlpha=a;
    cCtx.beginPath();cCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
    cCtx.fillStyle=p.color;cCtx.fill();cCtx.restore();
    return p.y>-4;
  });
}

const EFFECTS = {
  pulse:    {init:s=>{s.rings=[];s.f=0;},  tick:tickPulse},
  shimmer:  {init:initShimmer,              tick:tickShimmer},
  orbs:     {init:initOrbs,                 tick:tickOrbs},
  scanline: {init:s=>{s.lines=[];s.f=0;},  tick:tickScanline},
  confetti: {init:s=>s.p=[],               tick:tickConfetti},
  rise:     {init:s=>s.p=[],               tick:tickRise},
  none:     {init:()=>{},                   tick:()=>{}},
};

function fxLoop(){
  cCtx.clearRect(0,0,W,H);
  const eff=EFFECTS[CONFIG.finishFx];
  if(eff) eff.tick(fxState);
  fxRAF=requestAnimationFrame(fxLoop);
}
function startFx(){
  fxActive=true; fxState={};
  const eff=EFFECTS[CONFIG.finishFx];
  if(eff){ eff.init(fxState); }
  cCanvas.style.opacity='1';
  if(!fxRAF) fxLoop();
}
function stopFx(){
  fxActive=false; cCanvas.style.opacity='0';
  setTimeout(()=>{
    if(!fxActive){cancelAnimationFrame(fxRAF);fxRAF=null;fxState={};cCtx.clearRect(0,0,W,H);}
  },1500);
}

// ─────────────────────────────────────────────────────────────────────────────
// MAIN SEQUENCE
// ─────────────────────────────────────────────────────────────────────────────
async function playSequence() {
  const delays = makeDelays(CONFIG.pattern);

  stopFx();
  showOnly('start');
  ctx.clearRect(0,0,W,H);

  // 1. Hold on Start
  await wait(800 * CONFIG.speed);

  // 2. Start → Pitch Challenge  [block transition]
  await doBlockTransition('start', 'pitch', delays);

  // 3. Pause on Pitch Challenge for pitchPause ms  [no transition]
  await wait(CONFIG.pitchPause);

  // 4. Pitch Challenge → Count-3  [instant cut]
  await doCut('pitch', 'count3');

  // 5. Count-3 → Count-2 → Count-1  [1 second each]
  await wait(1000 - 80);
  await doCut('count3', 'count2');
  await wait(1000 - 80);
  await doCut('count2', 'count1');
  await wait(1000 - 80);

  // 6. Count-1 → Finish  [block transition]
  await doBlockTransition('count1', 'finish', delays);

  // 7. Finish screen — run background effect
  startFx();

  // Optional: loop back to start
  if (CONFIG.loop) {
    await wait(5000);
    await playSequence();
  }
}

window.addEventListener('load', () => wait(400).then(playSequence));
</script>
